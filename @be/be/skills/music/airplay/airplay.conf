// Jibo as an AirPlay speaker (shairport-sync, classic AirPlay). Started by skills/music/airplay.js.
general = {
  name = "%h"; // the robot's ID, e.g. Air-Degree-Lunch-Canvas
  // Jibo's own volume is the only volume: the phone's slider moves it (see airplay.js).
  ignore_volume_control = "yes";
  // AirPlay makes speakers hold ~2 s of audio, so the phone's play/pause/skip reached Jibo
  // ~2 s late. Play 1 s sooner (airplay.js LEAD shifts the lyrics to match). Measured on a
  // robot: sound starts 0.84 s after the sender instead of 1.84 s; -1.25 and -1.5 caused
  // long dropouts on some streams.
  audio_backend_latency_offset_in_seconds = -1.0;
};
alsa = {
  // Jibo's media mixer: shares the speaker with his voice.
  output_device = "MediaOut";
};
metadata = {
  enabled = "yes";
  include_cover_art = "yes";
  socket_address = "127.0.0.1";
  socket_port = 18702;
  socket_msglength = 65000;
};
sessioncontrol = {
  session_timeout = 20;
};
