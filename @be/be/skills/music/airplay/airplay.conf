// Jibo as an AirPlay speaker (shairport-sync, classic AirPlay). Started by skills/music/airplay.js.
general = {
  name = "%h"; // the robot's ID, e.g. Air-Degree-Lunch-Canvas
  // Jibo's own volume is the only volume: the phone's slider moves it (see airplay.js).
  ignore_volume_control = "yes";
};
alsa = {
  // Jibo's media mixer: shares the speaker with his voice.
  output_device = "MediaOut";
};
metadata = {
  enabled = "yes";
  include_cover_art = "yes";
  socket_address = "127.0.0.1";
  socket_port = 18702;
  socket_msglength = 65000;
};
sessioncontrol = {
  session_timeout = 20;
};
