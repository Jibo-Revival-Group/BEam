<!DOCTYPE html>
<html>
    <head>
        <title>Be</title>
        <style>
            body {
                margin: 0;
                overflow: hidden;
                background: #000;
            }
            #splash{
                background-image:url('./resources/JiboSplash.png');
                width: 1280px;
                height: 720px;
            }
            #face {
                width: 1280px;
                height: 720px;
            }
        </style>
    </head>
    <body>
        <div id="splash"></div>
        <div id="face"></div>
        <script>
          window.__BE_BOOT_T0 = Date.now();
          function bootMs () { return Date.now() - window.__BE_BOOT_T0; }
          // Splash is already in the DOM — paint before heavy requires.
          require('./skills-resolve').install();
          console.log('[Be] loading - boot skills-resolve - ' + bootMs() + ' MS');
          const Be = require("./index");
          console.log('[Be] loading - boot require Be - ' + bootMs() + ' MS');
          const registry = require('./skill-registry');
          let be = new Be();
          console.log('[Be] loading - boot Be construct - ' + bootMs() + ' MS');
          registry.install(be);
          console.log('[Be] loading - boot skill-registry - ' + bootMs() + ' MS');
          // BEacon off the critical path to skill construct / init.
          setTimeout(function () {
            try {
              require('./beacon').start();
              console.log('[Be] loading - boot beacon.start - ' + bootMs() + ' MS');
            } catch (err) {
              console.warn('[Be] beacon.start failed:', err && err.message);
            }
          }, 0);
          be.init(()=>{
             // @if DEBUG
             be.log.info("Finished running Be init");
             // @endif
          });
        </script>
    </body>
</html>
