<!DOCTYPE html>
<html lang="en">
<head>
  <title>Dance Puppeteer</title>
  <style>
    html, body { margin: 0; overflow: hidden; background: #000; }
    #face { width: 1280px; height: 720px; overflow: hidden; }
    #status {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #0f0;
      font-family: monospace;
      font-size: 24px;
      text-align: center;
      z-index: 99999;
    }
    #overlay {
      position: fixed;
      left: 0;
      top: 0;
      width: 1280px;
      height: 720px;
      background: #000;
      z-index: 99998;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #text-display {
      position: fixed;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 48px;
      text-align: center;
      z-index: 99997;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>
  <div id="face"></div>
  <div id="overlay">
    <div id="status">Starting Dance Puppeteer...</div>
  </div>
  <div id="text-display"></div>
  <script>
    const Skill = require('./index');
    const skill = new Skill();
  </script>
</body>
</html>
