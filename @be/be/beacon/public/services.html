<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jibo Services</title>
<style>
    :root { color-scheme: dark; --bg: #0b1017; --panel: #121a24; --line: #233041; --text: #dbe6f3; --muted: #7d8da1; --accent: #4cc3ff; --ok: #3ccf7a; --off: #e5534b; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; grid-template-rows: auto 1fr; background: var(--bg); color: var(--text); font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
    header h1 { margin: 0; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; }
    header h1 span { color: var(--accent); }
    header .grow { flex: 1; }
    header .hint { color: var(--muted); }
    a, button { color: var(--text); font: inherit; }
    .btn { border: 1px solid var(--line); background: #182231; border-radius: 6px; padding: 5px 10px; cursor: pointer; text-decoration: none; }
    .btn:hover, .btn:focus-visible { border-color: var(--accent); outline: none; }
    main { display: grid; grid-template-columns: 260px 1fr; min-height: 0; }
    nav { border-right: 1px solid var(--line); overflow-y: auto; padding: 8px 0; }
    nav button { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; padding: 7px 14px; text-align: left; cursor: pointer; }
    nav button:hover, nav button:focus-visible { background: #172130; outline: none; }
    nav button[aria-current="true"] { background: #1b2a3d; box-shadow: inset 3px 0 var(--accent); }
    nav .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
    nav .down .dot { background: var(--off); }
    nav .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    nav .port { color: var(--muted); }
    nav .nopage .name { color: var(--muted); }
    section { display: grid; grid-template-rows: auto 1fr; min-width: 0; }
    .bar { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line); min-height: 42px; }
    .bar strong { font-size: 14px; }
    .bar .grow { flex: 1; color: var(--muted); }
    iframe { width: 100%; height: 100%; border: 0; background: #fff; }
    .empty { display: grid; place-items: center; color: var(--muted); padding: 24px; text-align: center; }
    [hidden] { display: none !important; }
    @media (max-width: 700px) { main { grid-template-columns: 1fr; grid-template-rows: 40vh 1fr; } nav { border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
    <h1>Jibo <span>Services</span></h1>
    <span class="hint" id="summary" role="status">Loading…</span>
    <span class="grow"></span>
    <button class="btn" id="refresh" type="button">Refresh</button>
    <a class="btn" href="/#etc">Back to BEacon</a>
</header>
<main>
    <nav id="list" aria-label="Services"></nav>
    <section>
        <div class="bar"><strong id="title">Pick a service</strong><span class="grow" id="meta"></span><a class="btn" id="open" target="_blank" rel="noopener" hidden>Open in new tab</a></div>
        <iframe id="frame" title="Service page" hidden></iframe>
        <div class="empty" id="empty">Pick a service on the left to see its built-in page.<br>This list is only checked when you open the page or press Refresh.</div>
    </section>
</main>
<script src="services.js"></script>
</body>
</html>
